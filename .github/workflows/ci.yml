name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: API build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        working-directory: CodePlatform/apps
        run: |
          dotnet restore api/CodeQuest.Api.csproj
          dotnet restore tests/CodeQuest.Api.Tests.csproj

      - name: Build
        working-directory: CodePlatform/apps
        run: dotnet build api/CodeQuest.Api.csproj -c Release --no-restore

      - name: Test
        working-directory: CodePlatform/apps
        run: dotnet test tests/CodeQuest.Api.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: CodePlatform/apps/tests/TestResults/

  frontend:
    name: Web lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodePlatform/apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CodePlatform/apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --reporter=default

      - name: Build
        run: npm run build
