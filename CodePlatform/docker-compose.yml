services:
  postgres:
    image: postgres:16-alpine
    container_name: codequest-postgres
    environment:
      POSTGRES_USER: codequest
      POSTGRES_PASSWORD: codequest
      POSTGRES_DB: codequest
    ports:
      - "5432:5432"
    volumes:
      - codequest_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codequest -d codequest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codequest_postgres:
